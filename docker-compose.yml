version: '3.8'

services:
  # Next.js Application
  nextjs-app:
    image: ${DOCKER_USERNAME:-yourdockerhub}/sixnity-client:latest
    container_name: sixnity-client
    restart: unless-stopped
    ports:
      - "3005:3005"
    environment:
      - NODE_ENV=production
      - PORT=3005
    networks:
      - sixnity-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3005"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: sixnity-nginx
    restart: unless-stopped
    ports:
      - "3007:80"
      - "3008:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - nextjs-app
    networks:
      - sixnity-network

networks:
  sixnity-network:
    driver: bridge
